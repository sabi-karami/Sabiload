appId: com.sabikarami.sabiload
productName: Sabiload
copyright: Copyright © 2026 Saheb Karami
artifactName: ${name}-${version}-${os}-${arch}.${ext}
npmRebuild: false
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - resources/**
  - '!**/*.map'
  - '!node_modules/koffi/{src,vendor,doc}/**'
asarUnpack:
  - resources/**
  - node_modules/koffi/**
extraMetadata:
  main: ./out/main/index.js
win:
  executableName: Sabiload
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Sabiload
  artifactName: ${name}-${version}-setup.${ext}
mac:
  category: public.app-category.utilities
  icon: build/icon.png
  hardenedRuntime: false
  identity: '-'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  title: Sabiload ${version}
linux:
  icon: build/icon.png
  category: Network
  maintainer: Saheb Karami <saheb.karami@gmail.com>
  synopsis: Multi-network download accelerator
  description: Sabiload combines all of your internet connections to download files faster.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64]
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: sabi-karami
  repo: Sabiload
  releaseType: release
