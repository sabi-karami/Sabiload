<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/><stop offset="0.6" stop-color="#160d3d"/><stop offset="1" stop-color="#05202a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.34" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#faf5ff"/><stop offset="0.2" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="0.85" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.32" cy="0.22" r="0.25">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.5" stop-color="#93c5fd"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="0.55" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="s2" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <linearGradient id="s3" x1="0" x2="1"><stop offset="0" stop-color="#f43f5e" stop-opacity="0"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="clip"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>
    <g transform="translate(0 250) skewX(-30) scale(1 0.5)" opacity="0.8">
      <rect x="-400" y="0" width="2400" height="400" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 44" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g fill="#fff">
      <circle cx="120" cy="60" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="40" r="1" opacity="0.5"/><circle cx="650" cy="90" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="370" r="1.2" opacity="0.6"/><circle cx="560" cy="380" r="1" opacity="0.4"/><circle cx="1230" cy="70" r="1.3" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- streams flowing into the orb -->
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M700 110 C820 130 860 190 960 205" stroke="#ffffff" stroke-opacity="0.07"/>
      <path d="M700 210 C800 210 860 210 960 210" stroke="#ffffff" stroke-opacity="0.07"/>
      <path d="M700 310 C820 290 860 230 960 215" stroke="#ffffff" stroke-opacity="0.07"/>
      <path d="M700 110 C820 130 860 190 960 205" stroke="url(#s1)" stroke-dasharray="70 330">
        <animate attributeName="stroke-dashoffset" from="400" to="0" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M700 210 C800 210 860 210 960 210" stroke="url(#s2)" stroke-dasharray="70 330">
        <animate attributeName="stroke-dashoffset" from="400" to="0" dur="1.3s" repeatCount="indefinite"/></path>
      <path d="M700 310 C820 290 860 230 960 215" stroke="url(#s3)" stroke-dasharray="70 330">
        <animate attributeName="stroke-dashoffset" from="400" to="0" dur="1.9s" repeatCount="indefinite"/></path>
    </g>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#e9e6ff">
      <g transform="translate(600 92)"><rect width="104" height="38" rx="10" fill="#1a1240" stroke="#8b5cf6" stroke-opacity="0.6"/><text x="14" y="25">Wi-Fi</text></g>
      <g transform="translate(564 192)"><rect width="140" height="38" rx="10" fill="#0d2230" stroke="#22d3ee" stroke-opacity="0.6"/><text x="14" y="25">USB Phone</text></g>
      <g transform="translate(570 292)"><rect width="134" height="38" rx="10" fill="#2a0f22" stroke="#f43f5e" stroke-opacity="0.6"/><text x="14" y="25">Ethernet</text></g>
    </g>

    <!-- 3D orb -->
    <g transform="translate(1060 210)">
      <ellipse cx="0" cy="118" rx="110" ry="16" fill="#000" opacity="0.5" filter="url(#blur)"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/>
        <circle r="150" fill="#7c3aed" opacity="0.35" filter="url(#blur)"/>
        <ellipse rx="170" ry="38" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2" transform="rotate(-14)"/>
        <circle r="96" fill="url(#orb)"/>
        <circle r="96" fill="url(#shine)"/>
        <g transform="translate(-38 -40) scale(1.2)">
          <rect width="64" height="64" rx="18" fill="url(#tile)" opacity="0.95"/>
          <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5">
            <path d="M20 16 C20 28 32 26 32 36" opacity="0.75"/><path d="M44 16 C44 28 32 26 32 36" opacity="0.75"/>
            <path d="M32 13 V38"/><path d="M23 33 L32 43 L41 33"/>
          </g>
          <rect x="20" y="47" width="24" height="4" rx="2" fill="#fff"/>
        </g>
        <ellipse rx="150" ry="30" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-dasharray="180 120" transform="rotate(-14)" opacity="0.9">
          <animate attributeName="stroke-dashoffset" from="0" to="-600" dur="5s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse rx="190" ry="44" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="90 200" transform="rotate(10)" opacity="0.6">
          <animate attributeName="stroke-dashoffset" from="0" to="580" dur="8s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>

    <!-- text -->
    <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
      <text x="70" y="150" font-size="92" font-weight="900" fill="url(#txt)" letter-spacing="-3">Sabiload</text>
      <text x="74" y="200" font-size="27" font-weight="700" fill="#e9e6ff">Every connection. One download.</text>
      <text x="74" y="244" font-size="24" font-weight="700" fill="#a5b4fc" font-family="Vazirmatn, Tahoma, Segoe UI, sans-serif">همهٔ اینترنت‌ها، یک دانلود فوق‌سریع</text>
      <g transform="translate(74 290)" font-size="15" font-weight="700">
        <rect width="138" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.22" stroke="#8b5cf6" stroke-opacity="0.6"/>
        <text x="69" y="23" text-anchor="middle" fill="#ddd6fe">up to 3× faster</text>
        <rect x="150" width="168" height="36" rx="18" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="234" y="23" text-anchor="middle" fill="#cffafe">32 streams / network</text>
        <rect x="330" width="150" height="36" rx="18" fill="#f43f5e" fill-opacity="0.14" stroke="#f43f5e" stroke-opacity="0.5"/>
        <text x="405" y="23" text-anchor="middle" fill="#ffe4e6">Win · macOS · Linux</text>
      </g>
    </g>
    <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
