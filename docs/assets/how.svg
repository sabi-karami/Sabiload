<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0b2a"/><stop offset="1" stop-color="#081a24"/></linearGradient>
    <linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e9e6ff" font-size="20" font-weight="800">How Sabiload splits a file across your networks</text>
  <g font-size="14" fill="#c7c2f0">
    <text x="40" y="98">Wi-Fi</text><text x="40" y="158">USB phone</text><text x="40" y="218">Ethernet</text>
  </g>
  <g>
    <rect x="160" y="84" width="780" height="22" rx="6" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="160" y="144" width="780" height="22" rx="6" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="160" y="204" width="780" height="22" rx="6" fill="#ffffff" fill-opacity="0.05"/>
    <g fill="#8b5cf6">
      <rect x="160" y="84" width="0" height="22" rx="6"><animate attributeName="width" values="0;120;120" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="300" y="84" width="0" height="22" rx="6"><animate attributeName="width" values="0;0;130;130" keyTimes="0;0.25;0.5;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="450" y="84" width="0" height="22" rx="6"><animate attributeName="width" values="0;0;140;140" keyTimes="0;0.5;0.75;1" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#22d3ee">
      <rect x="160" y="144" width="0" height="22" rx="6"><animate attributeName="width" values="0;90;90" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="610" y="144" width="0" height="22" rx="6"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.4;0.75;1" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#f43f5e">
      <rect x="160" y="204" width="0" height="22" rx="6"><animate attributeName="width" values="0;70;70" keyTimes="0;0.35;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="740" y="204" width="0" height="22" rx="6"><animate attributeName="width" values="0;0;200;200" keyTimes="0;0.5;0.8;1" dur="6s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <text x="40" y="270" fill="#a59fd6" font-size="14">Pieces sit in one shared queue · faster networks take more · idle streams steal the slow tail · every byte lands in place</text>
</svg>
